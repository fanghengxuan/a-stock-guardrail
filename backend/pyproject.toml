[project]
name = "guardrail-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.64",
    "baostock>=0.9.3",
    "fastapi>=0.139.2",
    "openai-agents>=0.18.3",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.51.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
